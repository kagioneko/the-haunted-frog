[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "haunted-frog"
version = "0.1.0"
description = "A tiny open-source language model (CSE-Frog) learns Halloween and haunts your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emilia Lab / Kagino Neko (kagioneko)" }]
dependencies = ["cse-frog==0.2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["haunted_frog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
